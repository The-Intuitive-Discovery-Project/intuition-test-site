name: Build Remote Viewing 200 Target Bank

on:
  workflow_dispatch:
  push:
    branches:
      - work/remote-viewing-200-2026-09-22
    paths:
      - 'remote-viewing-v2/build_target_bank.py'
      - 'remote-viewing-v2/targets-new-curated*.json'
      - '.github/workflows/build-remote-viewing-200.yml'

permissions:
  contents: write

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: work/remote-viewing-200-2026-09-22
          fetch-depth: 0

      - name: Build and audit canonical target bank
        run: python3 remote-viewing-v2/build_target_bank.py

      - name: Commit generated canonical bank and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remote-viewing-v2/targets-original-32.json remote-viewing-v2/targets-curated.json remote-viewing-v2/targets-audit.json
          if git diff --cached --quiet; then
            echo "Generated files already current."
          else
            git commit -m "Build audited 200-target remote viewing bank"
            git push origin HEAD:work/remote-viewing-200-2026-09-22
          fi
